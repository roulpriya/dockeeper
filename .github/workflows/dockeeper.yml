name: Dockeeper Documentation Update

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  dockeeper:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Run dockeeper scan
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          # For PR events, compare PR base to head
          npm start -- ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
        else
          # For push events, compare previous commit to current
          npm start -- HEAD~1 HEAD
        fi

    - name: Check for documentation changes
      id: check-changes
      run: |
        if git diff --quiet HEAD -- README.md CONTRIBUTING.md; then
          echo "has-changes=false" >> $GITHUB_OUTPUT
        else
          echo "has-changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and create PR for documentation updates
      if: steps.check-changes.outputs.has-changes == 'true' && github.event_name != 'pull_request'
      run: |
        # Create a new branch for documentation updates
        BRANCH_NAME="docs/auto-update-$(date +%Y%m%d-%H%M%S)"
        git checkout -b "$BRANCH_NAME"
        
        # Add and commit changes
        git add README.md CONTRIBUTING.md
        git commit -m "docs: Auto-update documentation via Dockeeper

        🤖 Automated documentation update based on recent code changes
        
        Generated by Dockeeper CI workflow"
        
        # Push the branch
        git push origin "$BRANCH_NAME"
        
        # Create PR using GitHub CLI
        gh pr create \
          --title "📝 Auto-update documentation" \
          --body "## Summary

        This PR contains automated documentation updates generated by Dockeeper based on recent code changes.

        ## Changes
        - Updated README.md and/or CONTRIBUTING.md to reflect recent code changes
        - Generated automatically by analyzing git diffs and applying AI-powered documentation updates

        ## Review Notes
        - Please review the generated documentation for accuracy
        - The changes are based on code diffs and may need human refinement
        - This PR was created automatically by the Dockeeper CI workflow

        🤖 Auto-generated by Dockeeper" \
          --head "$BRANCH_NAME" \
          --base "${{ github.event.repository.default_branch }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment on PR with documentation status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const hasChanges = '${{ steps.check-changes.outputs.has-changes }}' === 'true';
          
          const comment = hasChanges 
            ? '📝 **Dockeeper Status**: Documentation has been automatically updated based on the code changes in this PR.'
            : '✅ **Dockeeper Status**: No documentation updates needed for this PR.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });